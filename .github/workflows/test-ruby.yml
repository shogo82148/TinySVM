name: Ruby Binding

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ruby:
          - "4.0"
          - "3.4"
          - "3.3"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install TinySVM
        run: |
          ./autogen.sh
          ./configure
          if [ "$(uname)" = "Darwin" ]; then
            make -j$(sysctl -n hw.ncpu)
          else
            make -j$(nproc)
          fi
          sudo make install
          sudo ldconfig
      - name: setup ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -v
      - name: build
        run: |
          ruby extconf.rb
          make
          make install
        working-directory: ruby
      - name: test
        run: |
          ruby test.rb
        working-directory: ruby
