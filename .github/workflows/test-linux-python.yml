name: Python Binding on Linux

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install TinySVM
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: setup python ${{ matrix.python }}
        uses: actions/setup-python@v1.2.4
        with:
          python-version: ${{ matrix.python }}
      - run: python -V
      - name: build and install
        run: |
          python -m pip install .
        working-directory: python
      - name: test
        run: |
          python test.py
        working-directory: python
