name: Perl Bindings

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        perl:
          - "5.44"
          - "5.42"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install TinySVM
        run: |
          ./autogen.sh
          ./configure
          if [ "$(uname)" = "Darwin" ]; then
            make -j$(sysctl -n hw.ncpu)
          else
            make -j$(nproc)
          fi
          sudo make install
          sudo ldconfig
      - name: setup perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: ${{ matrix.perl }}
      - run: perl -V
      - name: build and test
        run: |
          perl Makefile.PL
          make
          make test
        working-directory: perl
