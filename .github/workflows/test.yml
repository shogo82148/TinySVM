name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      # libtool adds the deprecated -bind_at_load linker flag on macOS
      # when MACOSX_DEPLOYMENT_TARGET is not set.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install autotools
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - name: configure
        run: |
          ./autogen.sh
          ./configure
      - name: build
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            make -j$(sysctl -n hw.ncpu)
          else
            make -j$(nproc)
          fi
      - name: test
        run: |
          make check
          sudo make install
