name: Java Binding

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - "8"
          - "11"
          - "17"
          - "21"
          - "25"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: setup java ${{ matrix.java }}
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: java -version
      - name: install TinySVM
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: build
        run: |
          make
          make test
        working-directory: java
